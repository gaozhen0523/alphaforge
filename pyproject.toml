[project]
name = "alphaforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gaozhen0523", email = "gaozhen0523@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.91",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pyarrow>=25.0.1",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "pybind11>=3.1.0",
]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "pybind11>=3.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
